[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nearswap"
version = "1.0.0"
description = "NearSwap: EBLG443 Tasarım Kalıpları dönem projesi"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pelin ALACA" }, { name = "Handan VURAL" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Gerçek yapay zekâ uyarlayıcıları için. Testler ve "fake" sağlayıcı bunlara ihtiyaç duymaz.
ai = ["openai>=1.40", "google-genai>=1.0"]
dev = ["pytest>=8", "mypy>=1.10", "httpx>=0.27"]

[tool.setuptools]
packages = ["nearswap"]

[tool.setuptools.package-data]
nearswap = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["nearswap", "tests"]

[[tool.mypy.overrides]]
module = ["openai.*", "google.*", "dotenv.*"]
ignore_missing_imports = true
